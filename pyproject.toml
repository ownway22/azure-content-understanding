[project]
name = "azure-content-understanding"
version = "0.1.0"
description = "Azure Content Understanding Document Analysis"
authors = [
    {name = "Frank Lin", email = "yu-hong.lin@microsoft.com"}
]
requires-python = ">=3.8"
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
